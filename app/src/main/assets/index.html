<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#126b4d">
<meta name="description" content="جنب بيتك — كل اللي تحتاجه حواليك">
<title>جنب بيتك</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js"></script>
<style>
:root{--green:#126b4d;--green2:#e8f4ee;--gold:#e2b64f;--ink:#17231e;--muted:#6b7771;--line:#e6ebe8;--bg:#f6f8f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,#0d5940,#16835d);color:white;padding:22px 18px 26px;border-radius:0 0 25px 25px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:25px;font-weight:850}.tag{font-size:13px;opacity:.9;margin-top:3px}
.pill{border:1px solid #ffffff55;border-radius:30px;padding:7px 11px;font-size:12px}
.search{margin-top:19px;display:flex;gap:8px}.search input{flex:1;min-width:0;border:0;border-radius:13px;padding:14px;font-size:15px;outline:none}.search button{border:0;border-radius:13px;background:var(--gold);color:#2c2617;font-weight:800;padding:0 16px}
main{max-width:760px;margin:auto;padding:17px 15px 90px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 12px}.section-head h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:12px}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cat{background:white;border:1px solid var(--line);border-radius:15px;padding:14px 8px;text-align:center;font-weight:700;font-size:13px;cursor:pointer}.cat span{display:block;font-size:23px;margin-bottom:7px}
.toolbar{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}.filter{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:20px;padding:8px 13px;font-size:12px}.filter.active{background:var(--green);color:white;border-color:var(--green)}
.cards{display:grid;gap:10px}.listing{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start}.avatar{width:48px;height:48px;flex:0 0 48px;border-radius:14px;background:var(--green2);display:grid;place-items:center;font-size:24px}.listing h3{font-size:15px;margin:0 0 4px}.listing p{margin:0 0 8px;font-size:12px;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a,.actions button{font:inherit;text-decoration:none;border:0;border-radius:9px;padding:7px 10px;font-size:12px;background:var(--green2);color:var(--green);font-weight:700}.empty{background:white;border:1px dashed #cbd7d0;padding:22px;border-radius:15px;text-align:center;color:var(--muted);font-size:13px}
.fab{position:fixed;bottom:18px;left:16px;background:var(--gold);color:#2b2619;border:0;border-radius:30px;padding:14px 19px;font-weight:850;box-shadow:0 6px 22px #0002}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;padding:16px;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(100%,560px);background:white;border-radius:22px 22px 14px 14px;padding:18px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 13px;font-size:19px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:white}.field textarea{min-height:70px}.submit{width:100%;border:0;background:var(--green);color:white;border-radius:12px;padding:13px;font-weight:800;margin-top:8px}.close{float:left;border:0;background:#f1f3f2;border-radius:9px;padding:7px 11px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:14px}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">جنب بيتك</div><div class="tag">كل اللي تحتاجه حواليك</div></div><div class="pill" id="connectionStatus">إسنا · جاري الاتصال</div></div><div class="search"><input id="q" placeholder="بتدور على إيه؟ محل، صنايعي، خدمة..." aria-label="بحث"><button id="searchBtn">بحث</button></div></header>
<main>
<div class="section-head"><h2>دور على اللي محتاجه</h2><span class="muted">اختار القسم</span></div>
<div class="categories" id="categories">
<button class="cat" data-cat="محلات"><span>🏪</span>محلات</button><button class="cat" data-cat="أكل ومشروبات"><span>🍽️</span>أكل ومشروبات</button><button class="cat" data-cat="صنايعية"><span>🧰</span>صنايعية</button><button class="cat" data-cat="صيانة"><span>🔧</span>صيانة</button><button class="cat" data-cat="توصيل"><span>🛵</span>توصيل</button><button class="cat" data-cat="خدمات منزلية"><span>🏠</span>خدمات منزلية</button>
</div>
<div class="section-head"><h2>الناس والخدمات حواليك</h2><span class="muted" id="count">0 نتيجة</span></div>
<div class="toolbar"><button class="filter active" data-type="الكل">الكل</button><button class="filter" data-type="محل">محلات</button><button class="filter" data-type="صنايعي">صنايعية</button><button class="filter" data-type="خدمة">خدمات</button></div>
<div class="cards" id="cards"><div class="empty">لسه مفيش بيانات منشورة. تقدر تضيف بيانات تجريبية من زر «أضف نشاطك».</div></div>
</main>
<footer id="appFooter">جنب بيتك — دليل الخدمات السحابي.</footer>
<button class="fab" id="addBtn">＋ أضف نشاطك</button>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="closeBtn">إغلاق ✕</button><h2>إضافة نشاط جديد</h2>
<form id="listingForm">
<div class="field"><label>اسم المحل أو الصنايعي *</label><input name="name" required maxlength="70" placeholder="مثال: أحمد للكهرباء"></div>
<div class="field"><label>نوع النشاط *</label><select name="type" required><option value="محل">محل</option><option value="صنايعي">صنايعي</option><option value="خدمة">خدمة</option></select></div>
<div class="field"><label>القسم *</label><select name="category"><option>محلات</option><option>أكل ومشروبات</option><option>صنايعية</option><option>صيانة</option><option>توصيل</option><option>خدمات منزلية</option></select></div>
<div class="field"><label>رقم التليفون / واتساب *</label><input name="phone" required inputmode="tel" placeholder="01xxxxxxxxx"></div>
<div class="field"><label>المنطقة أو العنوان</label><input name="area" placeholder="مثال: إسنا شارع البحر"></div>
<div class="field"><label>وصف مختصر</label><textarea name="description" maxlength="240" placeholder="اكتب الخدمة أو المنتجات..."></textarea></div>
<button class="submit" type="submit">حفظ كطلب مراجعة</button></form></div></div>
<script>
const SUPABASE_URL='https://qedaojphnxwoptitfzzk.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_VyDwQNzQQN9wj8iUqu1_DQ_IN7AgxRM';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let cloudRows=[],selectedType='الكل',selectedCategory='';
const cards=document.getElementById('cards');
async function loadCloudListings(){
 const status=document.getElementById('connectionStatus');
 try{
  const {data,error}=await supabaseClient.from('businesses').select('id,name,business_type,category,phone,whatsapp,address,description').eq('status','approved').order('created_at',{ascending:false});
  if(error) throw error;
  cloudRows=(data||[]).map(x=>({...x,type:({shop:'محل',food:'محل',craft:'صنايعي',maintenance:'صنايعي',delivery:'خدمة',home_service:'خدمة',other:'خدمة'})[x.business_type]||'خدمة',area:x.address||'إسنا'}));
  status.textContent='متصل بالسحابة';render();
 }catch(err){status.textContent='الاتصال غير متاح';cards.innerHTML='<div class="empty">تعذر تحميل البيانات السحابية. تحقق من الاتصال وإعدادات قاعدة البيانات.</div>';console.error(err);}
}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();const rows=cloudRows.filter(x=>(selectedType==='الكل'||x.type===selectedType)&&(!selectedCategory||x.category===selectedCategory)&&[x.name,x.category,x.area,x.description].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=rows.length+' نتيجة';cards.innerHTML='';if(!rows.length){cards.innerHTML='<div class="empty">مفيش نتائج مطابقة دلوقتي. جرّب كلمة تانية أو أضف نشاط جديد.</div>';return}rows.forEach(x=>{const el=document.createElement('article');el.className='listing';const avatar=x.type==='صنايعي'?'🧰':x.type==='خدمة'?'🚚':'🏪';const phone=x.phone.replace(/[^\d+]/g,'');el.innerHTML=`<div class="avatar">${avatar}</div><div style="min-width:0;flex:1"><h3></h3><p></p><div class="muted"></div><div class="actions"><a href="tel:${phone}">اتصال</a><a href="https://wa.me/${phone.replace(/^0/,'20')}" target="_blank" rel="noopener">واتساب</a></div></div>`;el.querySelector('h3').textContent=x.name;el.querySelector('p').textContent=x.category+' · '+x.type;el.querySelector('.muted').textContent=(x.area||'إسنا')+(x.description?' — '+x.description:'');cards.appendChild(el)})}
document.getElementById('searchBtn').onclick=render;document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedType=b.dataset.type;render()});
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{selectedCategory=selectedCategory===b.dataset.cat?'':b.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.style.outline=x.dataset.cat===selectedCategory?'2px solid #126b4d':'none');render()});
const modal=document.getElementById('modal');document.getElementById('addBtn').onclick=()=>alert('إضافة النشاط ستتاح بعد استكمال تسجيل دخول أصحاب الأنشطة ونظام الاشتراك.');document.getElementById('closeBtn').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
document.getElementById('listingForm').onsubmit=e=>{e.preventDefault();alert('لم يتم إرسال الطلب. تسجيل الدخول مطلوب لحفظ النشاط في قاعدة البيانات.');};loadCloudListings();
</script>
</body></html>
